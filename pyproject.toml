[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-action-admission"
version = "1.3.5"
description = "Provenance-aware evidence conservation for multi-view fusion and typed action admission."
keywords = ["information fusion", "multi-view learning", "evidential fusion", "provenance", "robotics"]
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zekai Jin"},
  {name = "Hanrong Zhang"},
  {name = "Yihong Tang"},
  {name = "Fei Hu"},
  {name = "Zhen Dong"},
  {name = "Yi Shao"},
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.01662"
Repository = "https://github.com/ZekaiJ/PACT"
Issues = "https://github.com/ZekaiJ/PACT/issues"
Documentation = "https://github.com/ZekaiJ/PACT/tree/main/docs"
